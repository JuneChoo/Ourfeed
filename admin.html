<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin · Ourfeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ourfeed-common.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="block-icon">⛏️</div>
    <div class="logo-text pixel-font"><span class="site-name">Ourfeed</span><span class="sub prose">admin</span></div>
  </div>
  <nav class="hotbar outset">
    <a href="feed.html">📗 Feed</a>
    <a href="review.html">🗃️ Drafts</a>
    <a href="admin.html" class="active">🛠️ Admin</a>
  </nav>
  <div style="display:flex; align-items:center; gap:12px;">
    <div class="identity" id="identity-toggle" title="Log out">
      <div class="head" id="identity-head">?</div>
    </div>
  </div>
</header>

<main>
  <div class="section-title pixel-font">Invite codes</div>
  <div class="section-sub">Generate a code so a new person can register. Each code works once.</div>
  <div id="error-area"></div>
  <button class="btn btn-submit" onclick="generateCode()" style="margin-bottom:18px;">+ Generate invite code</button>
  <div id="invite-list"></div>
</main>

<script src="ourfeed-common.js"></script>
<script>
function showError(msg) {
  document.getElementById("error-area").innerHTML = `<div class="error-banner">${msg}</div>`;
}

async function loadInvites() {
  try {
    const rows = await api("/api/invite-codes");
    const list = document.getElementById("invite-list");
    if (rows.length === 0) {
      list.innerHTML = `<div class="empty-state">No invite codes yet</div>`;
      return;
    }
    list.innerHTML = rows.map(r => `
      <div class="invite-row">
        <code>${r.code}</code>
        ${r.used_at ? `<span class="used">used by ${r.used_by_username}</span>` : `<span>unused</span>`}
      </div>
    `).join("");
  } catch (e) {
    showError(e.message);
  }
}

async function generateCode() {
  try {
    const { code } = await api("/api/invite-codes", { method: "POST" });
    await loadInvites();
    prompt("New invite code (copy it and send to the person you're inviting):", code);
  } catch (e) {
    alert("Failed: " + e.message);
  }
}

initAuth().then(me => {
  if (!me) return;
  if (me.role !== "admin") {
    document.querySelector("main").innerHTML = `<div class="empty-state">Only admins can see this page.</div>`;
    return;
  }
  loadInvites();
});
</script>

</body>
</html>
