<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Admin · Ourfeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ourfeed-common.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="block-icon">⛏️</div>
    <div class="logo-text pixel-font"><span class="site-name">Ourfeed</span><span class="sub prose">admin</span></div>
  </div>
  <nav class="hotbar outset">
    <a href="feed.html" data-i18n="nav_feed">Feed</a>
    <a href="review.html" data-i18n="nav_drafts">Drafts</a>
    <a href="automation.html" data-i18n="nav_automation">Automation</a>
    <a href="admin.html" class="active" data-i18n="nav_admin">Admin</a>
  </nav>
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="mc-chip lang-toggle">中文</button>
    <div class="identity" id="identity-toggle" data-i18n-title="logout_title" title="Log out">
      <div class="head" id="identity-head">?</div>
    </div>
  </div>
</header>

<main>
  <div class="section-title pixel-font" data-i18n="admin_section_title">Invite codes</div>
  <div class="section-sub" data-i18n="admin_section_sub">Generate a code so a new person can register. Each code works once.</div>
  <div id="error-area"></div>
  <button class="btn btn-submit" data-i18n="btn_generate" onclick="generateCode()" style="margin-bottom:18px;">+ Generate invite code</button>
  <div id="invite-list"></div>
</main>

<script src="ourfeed-common.js"></script>
<script>
function showError(msg) {
  document.getElementById("error-area").innerHTML = `<div class="error-banner">${msg}</div>`;
}

async function loadInvites() {
  try {
    const rows = await api("/api/invite-codes");
    const list = document.getElementById("invite-list");
    if (rows.length === 0) {
      list.innerHTML = `<div class="empty-state">${t("empty_invites")}</div>`;
      return;
    }
    list.innerHTML = rows.map(r => `
      <div class="invite-row">
        <code>${r.code}</code>
        ${r.used_at ? `<span class="used">${t("used_by", { name: r.used_by_username })}</span>` : `<span>${t("unused")}</span>`}
      </div>
    `).join("");
  } catch (e) {
    showError(e.message);
  }
}

function onLangChanged() { loadInvites(); }

async function generateCode() {
  try {
    const { code } = await api("/api/invite-codes", { method: "POST" });
    await loadInvites();
    prompt(t("prompt_new_code"), code);
  } catch (e) {
    alert(t("alert_failed") + e.message);
  }
}

initAuth().then(me => {
  if (!me) return;
  if (me.role !== "admin") {
    document.querySelector("main").innerHTML = `<div class="empty-state">${t("admin_only")}</div>`;
    return;
  }
  loadInvites();
});
</script>

</body>
</html>
