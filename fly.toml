app = "ourfeed-june"
primary_region = "sea"

[build]

[env]
  OURFEED_PORT = "8731"
  OURFEED_DB_PATH = "/data/ourfeed.db"
  OURFEED_CONFIG_PATH = "/data/config.json"
  OURFEED_COOKIE_SECURE = "true"

[[mounts]]
  source = "ourfeed_data"
  destination = "/data"

[http_service]
  internal_port = 8731
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
