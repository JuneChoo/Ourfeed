<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Drafts · Ourfeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ourfeed-common.css">
<style>
  main { padding-bottom: 140px; }

  .rule-box {
    background: rgba(0,0,0,0.25); border: 2px solid rgba(255,255,255,0.15);
    padding: 12px 14px; margin-bottom: 20px; font-family: 'Inter'; font-size: 12px;
    color: #cdbfa0; line-height: 1.6;
  }
  .rule-box b { color: var(--cream); }

  .draft-card .card-time { color: #8a7a5c; }
  .draft-actions { display: flex; gap: 8px; margin-top: 14px; }
  .draft-actions .mc-chip { flex: 1; text-align: center; }

  .publish-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 25;
    background: repeating-linear-gradient(90deg, var(--wood) 0 26px, var(--wood-dark) 26px 28px);
    border-top: 5px solid var(--wood-dark);
    box-shadow: 0 -4px 0 rgba(0,0,0,0.3);
    padding: 14px 20px calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .publish-bar .count { font-size: 10px; text-shadow: 1px 1px 0 rgba(0,0,0,0.5); }
  .publish-btn {
    font-family: 'Silkscreen'; font-weight: 700; font-size: 13px;
    padding: 12px 26px; cursor: pointer; color: #16290a;
  }
  .publish-btn:disabled { opacity: .5; cursor: not-allowed; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="block-icon">⛏️</div>
    <div class="logo-text pixel-font"><span class="site-name">Ourfeed</span><span class="sub prose tagline"></span></div>
  </div>
  <nav class="hotbar outset">
    <a href="feed.html" data-i18n="nav_feed">Feed</a>
    <a href="review.html" class="active" data-i18n="nav_drafts">Drafts</a>
    <a href="automation.html" data-i18n="nav_automation">Automation</a>
    <a href="admin.html" data-i18n="nav_admin" class="admin-only-nav" style="display:none;">Admin</a>
  </nav>
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="mc-chip lang-toggle">中文</button>
    <div class="stat-badge prose" id="stat-badge"></div>
    <div class="identity" id="identity-toggle" data-i18n-title="logout_title" title="Log out">
      <div class="head" id="identity-head">?</div>
    </div>
  </div>
</header>

<main>
  <div class="section-title pixel-font" data-i18n="drafts_section_title">Drafts</div>
  <div class="section-sub" data-i18n="drafts_section_sub">Opt-out review: leave it alone and it gets published</div>
  <div class="rule-box">
    <span data-i18n-html="rule1"></span><br>
    <span data-i18n-html="rule2"></span><br>
    <span data-i18n="rule3"></span>
  </div>
  <div class="channel-tabs" id="channel-tabs"></div>
  <div id="error-area"></div>
  <div id="queue-list"></div>
</main>

<div class="publish-bar" id="publish-bar" style="display:none;">
  <div class="count pixel-font" id="publish-count">0</div>
  <button class="publish-btn outset" id="publish-btn" data-i18n="btn_publish" onclick="confirmPublish()">✓ Publish this round</button>
</div>

<!-- 编辑 -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h2 class="pixel-font" data-i18n="edit_modal_title">Edit</h2>
    <input type="hidden" id="edit-id">
    <label data-i18n="edit_label_title">Title</label>
    <input type="text" id="edit-title" maxlength="80">
    <label data-i18n="edit_label_content">Content</label>
    <textarea id="edit-content"></textarea>
    <div class="modal-actions">
      <button class="btn btn-cancel" data-i18n="btn_cancel" onclick="closeEditModal()">Cancel</button>
      <button class="btn btn-submit" data-i18n="btn_save" onclick="submitEdit()">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <div class="toast-icon" id="toast-icon">🏆</div>
  <div class="toast-text">
    <div class="t1 pixel-font" id="toast-title" data-i18n="toast_title_achievement">ACHIEVEMENT GET!</div>
    <div class="t2" id="toast-msg">Published</div>
  </div>
</div>

<script src="ourfeed-common.js"></script>
<script>
let queue = [];
let currentChannel = "";

function showError(msg) {
  document.getElementById("error-area").innerHTML =
    `<div class="error-banner">${t("err_prefix")}${msg}<br>${t("err_suffix")}</div>`;
}
function clearError() { document.getElementById("error-area").innerHTML = ""; }

function renderChannelTabs() {
  const tabs = document.getElementById("channel-tabs");
  const active = currentChannel;
  const all = `<button class="${active === "" ? "active" : ""}" data-channel="" onclick="switchChannel('', this)">${t("tab_all")}</button>`;
  const rest = OURFEED_CONFIG.channels.map(c =>
    `<button class="${active === c.id ? "active" : ""}" data-channel="${c.id}" onclick="switchChannel('${c.id}', this)">${c.icon || ""} ${channelLabel(c)}</button>`
  ).join("");
  tabs.innerHTML = all + rest;
}

function draftCardHtml(entry) {
  return `
    <div class="card draft-card" id="draft-${entry.id}">
      <div class="card-top">
        <div class="card-head" style="--user-color:${entry.author_avatar_color}">${(entry.author_display_name || "?").slice(0,1).toUpperCase()}</div>
        <div class="card-name">${escapeHtml(entry.author_display_name)}</div>
        ${channelTagsHtml(entry, true)}
        <div class="card-time">${formatRelativeTime(entry.created_at)}</div>
      </div>
      ${entry.title ? `<div class="card-title">${escapeHtml(localizedField(entry.title))}</div>` : ""}
      <div class="card-body">${escapeHtml(localizedField(entry.content))}</div>
      <div class="draft-actions">
        <button class="mc-chip" onclick="openEditModal(${entry.id})">${t("btn_edit")}</button>
        <button class="mc-chip danger" onclick="privatize(${entry.id})">${t("btn_keep_private")}</button>
        <button class="mc-chip skip" onclick="skip(${entry.id})">${t("btn_skip")}</button>
      </div>
    </div>`;
}

function onEntryChanged() { loadQueue(); }
function onLangChanged() { renderChannelTabs(); renderQueue(); }

function renderQueue() {
  document.getElementById("stat-badge").textContent = t("stat_drafts", { n: queue.length });

  const list = document.getElementById("queue-list");
  if (queue.length === 0) {
    list.innerHTML = `<div class="empty-state"><span class="pixel-font">${t("empty_drafts_title")}</span>${t("empty_drafts_body")}</div>`;
  } else {
    list.innerHTML = queue.map(draftCardHtml).join("");
  }

  const bar = document.getElementById("publish-bar");
  const btn = document.getElementById("publish-btn");
  if (queue.length === 0) {
    bar.style.display = "none";
  } else {
    bar.style.display = "flex";
    document.getElementById("publish-count").textContent = t("publish_count", { n: queue.length });
    btn.disabled = false;
  }
}

function switchChannel(channel, btn) {
  currentChannel = channel;
  document.querySelectorAll(".channel-tabs button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  loadQueue();
}

async function loadQueue() {
  clearError();
  try {
    const chParam = currentChannel ? `?channel=${currentChannel}` : "";
    queue = await api(`/api/entries/review${chParam}`);
  } catch (e) {
    showError(e.message);
    return;
  }
  renderQueue();
}

async function privatize(id) {
  try {
    await api(`/api/entries/${id}/privatize`, { method: "POST" });
    queue = queue.filter(e => e.id !== id);
    renderQueue();
    showToast(t("toast_privatized"), "🔒");
  } catch (e) {
    alert(t("alert_failed") + e.message);
  }
}

async function skip(id) {
  try {
    await api(`/api/entries/${id}/skip`, { method: "POST" });
    queue = queue.filter(e => e.id !== id);
    renderQueue();
    showToast(t("toast_skipped"), "⏭");
  } catch (e) {
    alert(t("alert_failed") + e.message);
  }
}

async function confirmPublish() {
  if (queue.length === 0) return;
  const ids = queue.map(e => e.id);
  const btn = document.getElementById("publish-btn");
  btn.disabled = true;
  try {
    await api("/api/entries/publish", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ids }),
    });
    showToast(t("toast_published", { n: ids.length }), "🏆");
    await loadQueue();
  } catch (e) {
    alert(t("alert_publish_failed") + e.message);
    btn.disabled = false;
  }
}

// ---- 启动 ----
initAuth().then(me => {
  if (!me) return;
  renderChannelTabs();
  loadQueue();
});
</script>

</body>
</html>
