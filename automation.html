<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Automation · Ourfeed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ourfeed-common.css">
</head>
<body>

<header>
  <div class="logo">
    <div class="block-icon">⛏️</div>
    <div class="logo-text pixel-font"><span class="site-name">Ourfeed</span><span class="sub prose tagline"></span></div>
  </div>
  <nav class="hotbar outset">
    <a href="feed.html" data-i18n="nav_feed">Feed</a>
    <a href="review.html" data-i18n="nav_drafts">Drafts</a>
    <a href="automation.html" class="active" data-i18n="nav_automation">Automation</a>
    <a href="admin.html" data-i18n="nav_admin" class="admin-only-nav" style="display:none;">Admin</a>
  </nav>
  <div style="display:flex; align-items:center; gap:12px;">
    <button class="mc-chip lang-toggle">中文</button>
    <div class="identity" id="identity-toggle" data-i18n-title="logout_title" title="Log out">
      <div class="head" id="identity-head">?</div>
    </div>
  </div>
</header>

<main>
  <div class="section-title pixel-font" data-i18n="automation_section_title">Automation</div>
  <div class="section-sub" data-i18n="automation_section_sub">Let a script or AI agent post drafts on your behalf, using your own account.</div>
  <div class="rule-box" data-i18n="automation_explainer">Anything posted with a token still lands in Drafts, not straight on the feed.</div>

  <div id="error-area"></div>
  <button class="btn btn-submit" data-i18n="btn_generate_token" onclick="generateToken()" style="margin-bottom:18px;">+ Generate API token</button>
  <div id="token-list"></div>

  <div class="section-title pixel-font" data-i18n="automation_howto_title" style="margin-top:36px;">How to use it</div>
  <div class="section-sub" data-i18n="automation_howto_body">Send a POST request to /api/entries with an Authorization: Bearer header.</div>
  <div class="code-block" id="howto-curl"></div>
  <div class="code-block" id="howto-python"></div>
</main>

<script src="ourfeed-common.js"></script>
<script>
function showError(msg) {
  document.getElementById("error-area").innerHTML = `<div class="error-banner">${msg}</div>`;
}

function renderHowTo() {
  const origin = location.origin;
  document.getElementById("howto-curl").textContent =
`curl -X POST ${origin}/api/entries \\
  -H "Authorization: Bearer <token>" \\
  -H "Content-Type: application/json" \\
  -d '{"title": "Deployed v1.2", "content": "Shipped the new caching layer.", "channels": ["work"]}'`;

  document.getElementById("howto-python").textContent =
`import requests

requests.post("${origin}/api/entries",
    headers={"Authorization": "Bearer <token>"},
    json={"title": "Deployed v1.2", "content": "Shipped the new caching layer.", "channels": ["work"]})`;
}

async function loadTokens() {
  try {
    const rows = await api("/api/tokens");
    const list = document.getElementById("token-list");
    if (rows.length === 0) {
      list.innerHTML = `<div class="empty-state">${t("empty_tokens")}</div>`;
      return;
    }
    list.innerHTML = rows.map(r => `
      <div class="invite-row">
        <div class="row-main">
          <div>${escapeHtml(r.label) || "<em>" + t("label_token_name") + "</em>"}</div>
          <div class="row-meta">${r.last_used_at ? t("last_used_label", { time: formatRelativeTime(r.last_used_at) }) : t("last_used_never")}</div>
        </div>
        <button class="mc-chip danger" onclick="revokeToken(${r.id})">${t("btn_revoke")}</button>
      </div>
    `).join("");
  } catch (e) {
    showError(e.message);
  }
}

function onLangChanged() { loadTokens(); renderHowTo(); }

async function generateToken() {
  const label = prompt(t("label_token_name")) || "";
  try {
    const { token } = await api("/api/tokens", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ label }),
    });
    await loadTokens();
    prompt(t("prompt_new_token"), token);
  } catch (e) {
    alert(t("alert_failed") + e.message);
  }
}

async function revokeToken(id) {
  if (!confirm(t("confirm_revoke_token"))) return;
  try {
    await api(`/api/tokens/${id}`, { method: "DELETE" });
    loadTokens();
  } catch (e) {
    alert(t("alert_failed") + e.message);
  }
}

initAuth().then(me => {
  if (!me) return;
  renderHowTo();
  loadTokens();
});
</script>

</body>
</html>
